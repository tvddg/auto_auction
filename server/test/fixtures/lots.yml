# Идущий аукцион: ставки есть, лидер — не продавец
camry_active:
  car: camry
  seller: one
  leader: two
  vin: JTNB11HK103456789
  mileage: 87000
  color: Черный
  city: Москва
  status: active
  starting_price_cents: 150000000
  current_price_cents: 165000000
  bid_count: 3
  starts_at: <%= 1.day.ago %>
  ends_at: <%= 2.hours.from_now %>

# Прошлый аукцион той же машины (тот же VIN): закрытые лоты не мешают повторному выставлению
camry_unsold:
  car: camry
  seller: one
  vin: JTNB11HK103456789
  mileage: 86000
  color: Черный
  city: Москва
  status: unsold
  starting_price_cents: 180000000
  current_price_cents: 180000000
  bid_count: 0
  starts_at: <%= 10.days.ago %>
  ends_at: <%= 7.days.ago %>

# Запланированный аукцион: ставок и лидера ещё нет
